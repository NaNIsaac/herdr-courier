# courier settings. Copy to config.toml in the state directory to change any of them:
#   Windows  %LOCALAPPDATA%\herdr-courier\config.toml
#   others   $XDG_STATE_HOME/herdr-courier/config.toml (~/.local/state/herdr-courier/config.toml)
# COURIER_STATE_DIR moves the whole directory. Keys left out keep the values below, which are the
# built-in defaults. Unknown keys are an error.

[panes]
# courier panes checks pane labels against "<prefix><separator><name>".
separator = " · "
# A worker started from another pane is "<tab><worker_separator><task>".
worker_separator = " › "
# Panes under these prefixes are named after their tab. The first one is what a fix suggests for
# an unlabelled pane.
named_after_tab = ["lane", "core", "isaac"]
# Panes under these prefixes may take any name, such as the process they run.
named_freely = ["infra"]
# Set both lists to [] to turn the label check off.
# Working directories under these environment variables are shown as $NAME\...
path_variables = ["DEV", "DATA"]

[doctor]
# Endpoint files (JSON with a "pid") of other programs that can write prompts into panes. courier
# doctor fails while one of those processes is alive, since two writers can interleave. The
# default is isaac-control-center's in-process dispatcher.
other_writers = ["~/.isaac-control-center/dispatch/endpoint.json"]

[ovis]
# Ovis, the herdr browser and phone client; "" means there is none, and courier doctor skips it.
url = "http://127.0.0.1:7317"
# Agents a person also writes to through Ovis chat. While Ovis answers at url, a message for one
# of them waits for the end of the agent's turn and then for its state to stay unchanged for
# settle seconds, so a message queued in Ovis during the turn goes first. Ovis sends that message
# when the turn ends and leaves it unsent in the input box if another turn starts first.
panes = ["secretary"]
settle = 3.0

[mailbox]
# courier serve also appends every queued message to mailbox/<target>.jsonl in the state
# directory, with the journal's id. Typing is unchanged. See docs/mailbox.md.
write = false
# Agents for which `courier inbox --hook` returns their open messages to a Claude Code hook.
readers = []

[hold]
# A message for one of these agents while herdr does not know it, or while its pane shows no
# agent session, is held instead of refused or failed. It is typed in when the agent is back with
# the session it had (a resume), at most 10 at once and then one line about the rest; after
# another session it stays held, readable with `courier inbox`. Set to [] to turn this off.
when_missing = ["boss", "secretary"]
# While messages are held for the key, courier sends one summary to the value: at once, then at
# most every summary_every seconds while the count changes, and when the agent is back. Nothing
# is sent while that agent is missing too.
summary_to = { boss = "secretary", secretary = "boss" }
# Seconds a held message waits before it fails; a lost session of any other agent waits as long.
ttl = 14400.0
summary_every = 900.0

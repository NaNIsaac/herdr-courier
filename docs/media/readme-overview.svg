<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 348" width="1020" height="348" role="img" aria-label="Safe handoff between herdr panes"><title>Safe handoff between herdr panes</title><rect x="0" y="0" width="1020" height="348" rx="22" fill="#10192a"/><text x="34" y="46" font-family="Arial,sans-serif" font-size="27" fill="#f1f6ff" font-weight="bold">Safe handoff between herdr panes</text><text x="34" y="75" font-family="Arial,sans-serif" font-size="15" fill="#adc0d3">Messages submitted through courier are per-pane queued, not pasted over unfinished human input.</text><rect x="27" y="108" width="222" height="173" rx="14" fill="#1a2c43" stroke="#3c526b" stroke-width="1.5" /><rect x="41" y="124" width="29" height="29" rx="8" fill="#254e59"/><text x="55" y="144" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#73e3c1">1</text><text x="78" y="144" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#f1f6ff">Send message</text><text x="41" y="184" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">courier send boss</text><text x="41" y="208" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">normal agent task</text><text x="41" y="263" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#73e3c1">enqueue</text><path d="M 253 194 h16 m-7 -6 7 6 -7 6" fill="none" stroke="#73e3c1" stroke-width="2" stroke-linecap="round"/><rect x="275" y="108" width="222" height="173" rx="14" fill="#1a2c43" stroke="#3c526b" stroke-width="1.5" /><rect x="289" y="124" width="29" height="29" rx="8" fill="#254e59"/><text x="303" y="144" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#73e3c1">2</text><text x="326" y="144" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#f1f6ff">Per-pane queue</text><text x="289" y="184" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">preserves arrival order</text><text x="289" y="208" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">holds while typing</text><text x="289" y="263" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#73e3c1">wait when busy</text><path d="M 501 194 h16 m-7 -6 7 6 -7 6" fill="none" stroke="#73e3c1" stroke-width="2" stroke-linecap="round"/><rect x="523" y="108" width="222" height="173" rx="14" fill="#1a2c43" stroke="#3c526b" stroke-width="1.5" /><rect x="537" y="124" width="29" height="29" rx="8" fill="#254e59"/><text x="551" y="144" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#73e3c1">3</text><text x="574" y="144" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#f1f6ff">Delivery gate</text><text x="537" y="184" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">input empty</text><text x="537" y="208" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">and pane not held</text><text x="537" y="263" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#73e3c1">safe to type</text><path d="M 749 194 h16 m-7 -6 7 6 -7 6" fill="none" stroke="#73e3c1" stroke-width="2" stroke-linecap="round"/><rect x="771" y="108" width="222" height="173" rx="14" fill="#1a2c43" stroke="#3c526b" stroke-width="1.5" /><rect x="785" y="124" width="29" height="29" rx="8" fill="#254e59"/><text x="799" y="144" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#73e3c1">4</text><text x="822" y="144" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#f1f6ff">Deliver</text><text x="785" y="184" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">one message at a time</text><text x="785" y="208" font-family="Arial,sans-serif" font-size="14" fill="#adc0d3">target agent resumes</text><text x="785" y="263" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#73e3c1">dispatcher action</text><path d="M 34 302 H 986" stroke="#3c526b"/><text x="34" y="327" font-family="Arial,sans-serif" font-size="13.5" fill="#f6b977">Direct 'herdr agent prompt' calls do not use courier's safety gate.</text></svg>

[project]
name = "herdr-courier"
version = "0.1.0"
description = "A prompt queue for herdr panes that never types over a human's half-written input"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
courier = "herdr_courier.cli:main"
courierd = "herdr_courier.daemon:main"
hc = "herdr_courier.cli:main"
hcd = "herdr_courier.daemon:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Windows, a live herdr session and COURIER_INTEGRATION=1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

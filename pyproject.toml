[project]
name = "herdr-console"
version = "0.1.0"
description = "Safe terminal control for herdr: a prompt dispatcher that never types over a human's half-written input"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
hc = "herdr_console.cli:main"
hcd = "herdr_console.daemon:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Windows, a live herdr session and HC_INTEGRATION=1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[project]
name = "herdr-courier"
version = "0.2.0"
description = "A prompt queue for herdr panes that never types over a human's half-written input"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.13"
dependencies = []
keywords = ["herdr", "terminal", "ai-agents", "claude-code", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/NaNIsaac/herdr-courier"
Documentation = "https://github.com/NaNIsaac/herdr-courier#readme"
Changelog = "https://github.com/NaNIsaac/herdr-courier/blob/main/CHANGELOG.md"
Issues = "https://github.com/NaNIsaac/herdr-courier/issues"

[project.scripts]
courier = "herdr_courier.cli:main"
hc = "herdr_courier.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Windows, a live herdr session and COURIER_INTEGRATION=1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
